name: Tracked artifact safety
on:
  push:
    branches: [hygiene/milaan-repository-audit]
  pull_request:
    paths: ['scripts/check_tracked_artifact_names.py', '.github/workflows/secret-paths.yml']

permissions:
  contents: read

jobs:
  tracked-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python scripts/check_tracked_artifact_names.py
