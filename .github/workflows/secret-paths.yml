name: Tracked artifact safety
on:
  push:
    branches: [hygiene/milaan-repository-audit]
  pull_request:
    paths: ['scripts/check_tracked_artifact_names.py', '.github/workflows/secret-paths.yml']

permissions:
  contents: read

jobs:
  tracked-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_tracked_artifact_names.py
