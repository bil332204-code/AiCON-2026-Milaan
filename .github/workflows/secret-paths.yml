name: Tracked artifact safety
on:
  push:
    branches: [hygiene/milaan-repository-audit]
  pull_request:
    paths: ['scripts/check_tracked_artifact_names.py', '.github/workflows/secret-paths.yml']

permissions:
  contents: read

jobs:
  tracked-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/check_tracked_artifact_names.py
