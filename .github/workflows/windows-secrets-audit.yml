name: Windows launch and historical secret audit
on:
  push:
    branches: [feat/milaan-phase1-guide-trust-security, hygiene/milaan-repository-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-batch-smoke:
    runs-on: windows-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated synthetic demo account without real user secrets
        shell: pwsh
        run: |
          Copy-Item 'milaan/backend/.env.example' 'milaan/backend/.env'
          Add-Content 'milaan/backend/.env' 'DEMO_SELLER_EMAIL=windows-smoke@example.com'
          Add-Content 'milaan/backend/.env' 'DEMO_SELLER_PASSWORD=synthetic-windows-smoke-password'
      - name: Execute SETUP.bat on Windows
        timeout-minutes: 20
        shell: cmd
        run: |
          echo. | call SETUP.bat
          if errorlevel 1 exit /b 1
          if not exist ".venv\Scripts\python.exe" exit /b 2
          ".venv\Scripts\python.exe" -c "import fastapi, uvicorn, alembic; print('Windows environment installed')"
      - name: Execute START_DEMO.bat and probe both local servers
        timeout-minutes: 5
        shell: pwsh
        run: |
          # Invoke directly: Start-Process -Wait waits for cmd /k descendants forever.
          & cmd.exe /c "echo.|call START_DEMO.bat"
          if ($LASTEXITCODE -ne 0) { throw "START_DEMO.bat returned exit code $LASTEXITCODE" }
          $services = @(
            @{Label='Milaan'; Url='http://127.0.0.1:8000/api/health'},
            @{Label='Demo store'; Url='http://127.0.0.1:8090/'}
          )
          foreach($service in $services) {
            $ok = $false
            for ($i=0; $i -lt 50; $i++) {
              try {
                $r = Invoke-WebRequest -Uri $service.Url -MaximumRedirection 2 -TimeoutSec 3 -UseBasicParsing
                if ($r.StatusCode -eq 200) { Write-Output "$($service.Label): HTTP 200"; $ok = $true; break }
              } catch {}
              Start-Sleep -Seconds 2
            }
            if (-not $ok) { throw "$($service.Label) did not respond at $($service.Url)" }
          }

  full-git-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full fetched Git history for credential patterns (redact matches)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo ghcr.io/gitleaks/gitleaks:latest git --redact --no-banner --log-opts="--all" --report-format=json --report-path=/repo/.gitleaks-temp-report.json --exit-code=1 /repo
          status=$?
          set -e
          if [[ -s .gitleaks-temp-report.json ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          findings=json.loads(Path('.gitleaks-temp-report.json').read_text())
          for finding in findings:
              print('POTENTIAL_SECRET class=%s path=%s line=%s commit=%s' % (
                  finding.get('RuleID','unknown'),
                  finding.get('File','unknown'),
                  finding.get('StartLine','unknown'),
                  str(finding.get('Commit','unknown'))[:12]))
          PY
          fi
          rm -f .gitleaks-temp-report.json
          exit "$status"
