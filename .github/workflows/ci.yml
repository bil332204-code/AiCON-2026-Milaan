name: Local release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: sqlite:////tmp/milaan-ci.db
      STORAGE_DIR: /tmp/milaan-ci-uploads
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python -m pip install -c milaan/backend/constraints-py312.txt -r milaan/backend/requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q milaan/backend/app tests
      - run: python -m pytest tests matching/tests
        working-directory: milaan/backend
      - run: python -m alembic upgrade head && python -m alembic check
        working-directory: milaan/backend
      - run: python -m pytest tests/test_migrations.py
      - name: PostgreSQL and private S3 integration (synthetic local services)
        run: python scripts/test_postgres_s3.py
      - run: python scripts/frontend_perf_budget.py
      - run: node --test milaan/frontend/tests/*.test.mjs
      - run: npm --prefix milaan/frontend run check
      - name: Install browser test dependencies
        run: npm ci
        working-directory: tests/browser
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - name: Browser workflows on desktop and mobile
        run: npm test
        working-directory: tests/browser
        env:
          MILAAN_TEST_PYTHON: python
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-browser-evidence
          path: |
            docs/screenshots/*.png
            tests/browser/test-results/
          retention-days: 7
      - name: Build integrated deployment image
        run: docker build -t milaan-v3-review:local .
      - name: Validate container persistence and cookie authentication
        run: python scripts/container_smoke.py
