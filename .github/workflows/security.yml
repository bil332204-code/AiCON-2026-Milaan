name: Security scans
on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'   # weekly, catches newly published advisories
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1 bandit==1.9.4
      - name: Known vulnerabilities in pinned Python dependencies
        run: pip-audit --strict -r milaan/backend/constraints-py312.txt
      - name: Static security analysis (medium and high findings fail the build)
        run: bandit -q -r milaan/backend/app -ll -x milaan/backend/tests
