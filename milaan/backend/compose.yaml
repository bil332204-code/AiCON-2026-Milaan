services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: milaan
      POSTGRES_USER: milaan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milaan -d milaan"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://milaan:${POSTGRES_PASSWORD}@db:5432/milaan
      STORAGE_DIR: /app/data/uploads
      RUN_WORKER_IN_API: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - receipts:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  database:
  receipts:
